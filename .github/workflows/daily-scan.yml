name: Daily 5-day picks

on:
  schedule:
    - cron: '0 6 * * *'        # 06:00 UTC = 09:00 Doha, every day
  workflow_dispatch:
    inputs:
      retrain:
        description: 'Retrain the ML model now'
        type: boolean
        default: false

concurrency: daily-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pro/requirements.txt

      - run: pip install -r requirements.txt firebase-admin

      - name: Which week is it
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The model is retrained once a week and kept in GitHub's cache between days.
      - name: Load this week's model
        id: model
        uses: actions/cache@v4
        with:
          path: pro/model.joblib
          key: ml-model-${{ steps.week.outputs.week }}

      - name: Train (weekly)
        if: steps.model.outputs.cache-hit != 'true' || inputs.retrain
        run: python ml_model.py train

      - name: Scan and send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ml_model.py scan picks.json

      - name: Update the AI Trade Notify apps
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python publish_firebase.py picks.json
