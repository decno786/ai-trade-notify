name: Build PRO WebView app

on:
  push:
    paths: ['pro/android-webview/**', '.github/workflows/webview-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pro/android-webview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk AI-Trade-Signals-WebView.apk

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webview-app
          name: AI Trade Signals - PRO WebView app
          body: Android app that shows your api_server.py dashboard. On first launch, enter your server address.
          files: pro/android-webview/AI-Trade-Signals-WebView.apk
          make_latest: false
